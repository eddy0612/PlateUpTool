name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        working-directory: src
        run: npm install

      - name: Build
        working-directory: src
        run: npm run build

      - name: Build `dev` branch if it exists
        run: |
          if git ls-remote --heads origin dev | grep -q refs/heads/dev; then
            echo "dev branch found — building into src/dist/dev"
            git fetch origin dev
            if git show-ref --verify --quiet refs/heads/dev; then
              git checkout dev
            else
              git checkout -b dev origin/dev
            fi
            cd src
            npm install
            npm run build -- --outDir dist/dev --base /PlateUpTool/dev/
            cd -
            git checkout -
          else
            echo "dev branch not found; skipping dev build"
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: src/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
